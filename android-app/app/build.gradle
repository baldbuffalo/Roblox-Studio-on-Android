plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.example.exeunpacker'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.example.exeunpacker"
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // box64/wine are exec'd as standalone binaries via shell, not dlopen'd
    // as JNI libraries -- that requires a real file on disk. AGP's default
    // packaging mmaps native libs directly out of the compressed APK
    // instead of extracting them, which breaks exec(). Force legacy
    // (extract-to-disk) packaging so nativeLibraryDir actually contains
    // real, executable files.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
}
