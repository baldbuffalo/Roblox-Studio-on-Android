name: Build Production Android APK Launcher
on:
  push:
    paths:
      - 'android-app/**' # Runs exclusively when app interface changes are checked in

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Set up JDK 17 Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # No gradlew is committed to this repo. Rather than relying on a
      # global `gradle` command, generate the wrapper here so the actual
      # build step is reproducible the same way it would be locally.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.6.1

      - name: Generate Gradle Wrapper
        run: |
          cd android-app
          gradle wrapper --gradle-version 9.6.1
          chmod +x gradlew

      - name: Build Production Debug APK Package
        run: |
          cd android-app
          ./gradlew assembleDebug --warning-mode all

      - name: Publish Android Launcher APK to Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-app-release
          name: "Production App Main Workspace Release"
          body: "Install this APK file onto your hardware device. Translation engine components will download natively inside the application on boot."
          draft: false
          prerelease: false
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
