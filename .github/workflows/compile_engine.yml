name: Scheduled Engine Binaries Compiler
on:
  schedule:
    - cron: '0 0 * * 0' # Automated tracking checks every Sunday at midnight
  workflow_dispatch:     # Enables manual force trigger via GitHub actions dashboard

jobs:
  build-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Install Architecture Cross-Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake git wget curl tar xz-utils jq

      - name: Set up Python 3.15.0-beta.4 (pre-release)
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.15.0-beta.4'
          allow-prereleases: true

      - name: Compile Latest Box64 for Android ARM64
        run: |
          git clone --depth 1 https://github.com/ptitSeb/box64.git box64
          cd box64 && mkdir build && cd build
          # Box64 must run as a native aarch64 binary on Android devices, but
          # this runner is x86_64 -- so cross-compile explicitly rather than
          # building natively (a native x86_64 build chokes on the ARM64
          # inline asm that ARM_DYNAREC=1 pulls in, e.g. `mrs`/`dc cvau`/`isb`).
          CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DARM64=1 -DARM_DYNAREC=1 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          make -j"$(nproc)"
          file box64   # sanity check: must report ARM aarch64, not x86-64
          tar -czvf ../../box64-latest.tar.gz box64

      - name: Fetch Latest Upstream Linux PC Wine Build
        run: |
          # Resolve the latest release via the GitHub API instead of scraping HTML,
          # and pick the plain amd64 build (skip staging/tkg variants).
          ASSET_URL=$(curl -s https://api.github.com/repos/Kron4ek/Wine-Builds/releases/latest \
            | jq -r '.assets[] | select(.name | test("^wine-.*-amd64\\.tar\\.xz$")) | select(.name | test("staging|tkg"; "i") | not) | .browser_download_url' \
            | head -n 1)
          echo "Resolved Wine asset: $ASSET_URL"
          wget -O wine64-latest.tar.xz "$ASSET_URL"
          mkdir wine-extracted
          tar -xf wine64-latest.tar.xz -C wine-extracted --strip-components=1

      - name: Place Executables Into jniLibs (installer-extracted, so they're actually executable at runtime)
        run: |
          # Android enforces W^X on files an app writes to its own storage at
          # runtime (getFilesDir()) since API 29 -- such files can't be exec'd.
          # jniLibs/<abi>/*.so is extracted by PackageManager itself at
          # INSTALL time, which is exempt from that restriction. Renaming
          # these executables to lib*.so and placing them here is how
          # Winlator and similar projects work around this.
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a
          mkdir -p android-app/app/src/main/jniLibs/x86_64

          cp box64/build/box64 android-app/app/src/main/jniLibs/arm64-v8a/libbox64.so
          # wine64 itself is an x86_64 binary either way; on arm64-v8a devices
          # it's invoked through box64, on x86_64 devices directly.
          cp wine-extracted/bin/wine64 android-app/app/src/main/jniLibs/arm64-v8a/libwine64.so
          cp wine-extracted/bin/wine64 android-app/app/src/main/jniLibs/x86_64/libwine64.so

      - name: Bundle Wine Support Files Into App (assets/engine/)
        run: |
          # Only the executables themselves need the jniLibs treatment.
          # Wine's lib/share support tree is just data Wine reads at runtime,
          # not something Android itself needs to exec, so it can still ship
          # as a plain archive extracted to internal storage on first launch.
          rm -f wine-extracted/bin/wine64
          mkdir -p android-app/app/src/main/assets/engine
          tar -czf wine-support.tar.gz -C wine-extracted .
          mv wine-support.tar.gz android-app/app/src/main/assets/engine/
          # Old artifacts from the previous (pre-jniLibs) bundling approach.
          rm -f android-app/app/src/main/assets/engine/box64-latest.tar.gz
          rm -f android-app/app/src/main/assets/engine/wine64-latest.tar.xz

      - name: Commit Bundled Engine Assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/jniLibs/ android-app/app/src/main/assets/engine/
          git diff --staged --quiet || git commit -m "Update bundled Box64/Wine engine assets [skip ci]"
          git push
