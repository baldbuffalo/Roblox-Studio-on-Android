name: Scheduled Engine Binaries Compiler
on:
  workflow_dispatch:     # Enables manual force trigger via GitHub actions dashboard

jobs:
  build-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          lfs: true

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf jq curl unzip

      - name: Resolve Latest Winlator Release APK
        run: |
          # Winlator (brunodev85/winlator) ships real, working Android-native
          # (Bionic-compatible) Box64 + Wine + a compiled glibc runtime,
          # bundled directly inside its release APK. We extract those real
          # binaries rather than trying to cross-compile our own -- Box64/Wine
          # built with a generic Linux toolchain produce glibc-linked
          # binaries that cannot run on Android's Bionic libc at all, since
          # Android has no glibc and no path like /lib/ld-linux-aarch64.so.1.
          API_URL="https://api.github.com/repos/brunodev85/winlator/releases/latest"
          APK_URL=$(curl -s "$API_URL" | jq -r '.assets[] | select(.name | test("\\.apk$")) | .browser_download_url' | head -n 1)
          echo "Resolved Winlator APK: $APK_URL"
          curl -sL -o winlator.apk "$APK_URL"
          unzip -o winlator.apk "assets/rootfs.tzst" "assets/box64/*" -d apk_contents

      - name: Extract glibc Runtime and Wine
        run: |
          mkdir -p rootfs_extracted
          tar --zstd -xf apk_contents/assets/rootfs.tzst -C rootfs_extracted
          echo "--- confirming glibc runtime present ---"
          test -f rootfs_extracted/usr/lib/ld-linux-aarch64.so.1
          test -f rootfs_extracted/usr/lib/libc.so.6
          echo "--- confirming wine binary present ---"
          test -f rootfs_extracted/opt/wine/bin/wine

      - name: Extract Latest Box64 Build
        run: |
          # Pick the highest version number available in assets/box64/*.tzst
          LATEST_BOX64=$(ls apk_contents/assets/box64/box64-*.tzst | sort -V | tail -n 1)
          echo "Using: $LATEST_BOX64"
          mkdir box64_extracted
          tar --zstd -xf "$LATEST_BOX64" -C box64_extracted
          file box64_extracted/usr/local/bin/box64

      - name: Patch Box64 Interpreter for This App's Package Path
        run: |
          # Box64 is a genuine glibc-linked binary; Android has no glibc, so
          # its ELF interpreter must point at a real glibc runtime WE bundle
          # and extract at a fixed, known path inside our own app's private
          # storage (see EngineManager.extractGlibcIfNeeded / GLIBC_ASSET_NAME).
          # This must exactly match android-app's applicationId.
          GLIBC_PATH="/data/data/com.example.exeunpacker/files/glibc-lib/ld-linux-aarch64.so.1"
          patchelf --set-interpreter "$GLIBC_PATH" box64_extracted/usr/local/bin/box64
          patchelf --set-rpath "/data/data/com.example.exeunpacker/files/glibc-lib" box64_extracted/usr/local/bin/box64
          echo "--- verifying patch ---"
          patchelf --print-interpreter box64_extracted/usr/local/bin/box64

      - name: Place Executables Into jniLibs (installer-extracted, so they're actually executable at runtime)
        run: |
          # Android enforces W^X on files an app writes to its own storage at
          # runtime (getFilesDir()) since API 29 -- such files can't be exec'd.
          # jniLibs/<abi>/*.so is extracted by PackageManager itself at
          # INSTALL time, which is exempt from that restriction.
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a
          cp box64_extracted/usr/local/bin/box64 android-app/app/src/main/jniLibs/arm64-v8a/libbox64.so
          cp rootfs_extracted/opt/wine/bin/wine android-app/app/src/main/jniLibs/arm64-v8a/libwine.so
          chmod +x android-app/app/src/main/jniLibs/arm64-v8a/libbox64.so
          chmod +x android-app/app/src/main/jniLibs/arm64-v8a/libwine.so

      - name: Bundle glibc Runtime and Wine Support Files Into App (assets/engine/)
        run: |
          mkdir -p android-app/app/src/main/assets/engine

          # glibc runtime box64 needs to start at all (see patch step above).
          tar -czf glibc-lib.tar.gz -C rootfs_extracted/usr/lib .
          mv glibc-lib.tar.gz android-app/app/src/main/assets/engine/

          # Wine's lib/share/bin support tree -- must come from the SAME
          # Wine build as the binary placed in jniLibs above, since mixing
          # different Wine builds/versions breaks in confusing ways.
          mkdir -p wine_support/bin
          cp -r rootfs_extracted/opt/wine/lib wine_support/
          cp -r rootfs_extracted/opt/wine/share wine_support/
          cp rootfs_extracted/opt/wine/bin/* wine_support/bin/
          rm -f wine_support/bin/wine  # already placed separately as jniLibs/libwine.so
          tar -czf wine-support.tar.gz -C wine_support .
          mv wine-support.tar.gz android-app/app/src/main/assets/engine/

      - name: Commit Bundled Engine Assets
        run: |
          sudo apt-get install -y git-lfs
          git lfs install

          # GitHub hard-rejects files over 100MB via plain git; several of
          # these assets exceed or approach that, so they go through Git LFS.
          if [ ! -f .gitattributes ] || ! grep -q "filter=lfs" .gitattributes; then
            echo "android-app/app/src/main/jniLibs/**/*.so filter=lfs diff=lfs merge=lfs -text" >> .gitattributes
            echo "android-app/app/src/main/assets/engine/*.tar.gz filter=lfs diff=lfs merge=lfs -text" >> .gitattributes
            echo "android-app/app/src/main/assets/engine/*.tar.xz filter=lfs diff=lfs merge=lfs -text" >> .gitattributes
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .gitattributes android-app/app/src/main/jniLibs/ android-app/app/src/main/assets/engine/
          git diff --staged --quiet || git commit -m "Update bundled engine binaries from latest Winlator release [skip ci]"
          git push
